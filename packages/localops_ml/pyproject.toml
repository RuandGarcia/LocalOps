[project]
name = "localops-ml"
version = "0.2.0"
description = "LocalOps S2: walk-forward forecast and alarm noise filter"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow", "openpyxl", "numpy", "xgboost>=2.0", "scikit-learn>=1.4", "prophet>=1.1", "holidays"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["localops_ml"]
